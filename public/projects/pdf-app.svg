<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgPdf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f0a10"/>
      <stop offset="100%" stop-color="#090306"/>
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgPdf)"/>

  <!-- Central PDF Card -->
  <rect x="250" y="90" width="300" height="250" rx="20" fill="#180c11" stroke="#ef4444" stroke-width="2.5"/>

  <!-- Document Shape -->
  <g transform="translate(330, 120)">
    <path d="M0 0 L100 0 L140 40 L140 180 L0 180 Z" fill="#2d131b" stroke="#ef4444" stroke-width="2"/>
    <path d="M100 0 L100 40 L140 40 Z" fill="#ef4444"/>
    <text x="70" y="115" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="900" letter-spacing="2">PDF</text>
    
    <!-- Compression arrows indicator -->
    <path d="M40 145 L70 145 M60 138 L70 145 L60 152" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M100 145 L70 145 M80 138 L70 145 L80 152" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Pills -->
  <g transform="translate(160, 245)">
    <rect width="130" height="34" rx="17" fill="#180c11" stroke="#22c55e" stroke-width="1.5"/>
    <text x="65" y="22" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11" font-weight="bold">100% OFFLINE</text>
  </g>
  <g transform="translate(510, 245)">
    <rect width="135" height="34" rx="17" fill="#180c11" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="67" y="22" text-anchor="middle" fill="#7dd3fc" font-family="monospace" font-size="11" font-weight="bold">WASM POWERED</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="405" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">Kompres PDF &amp; Document Utility</text>
  <text x="400" y="438" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">Solo Web Tool · Client-Side WASM &amp; Zero-Upload Privacy</text>
</svg>
