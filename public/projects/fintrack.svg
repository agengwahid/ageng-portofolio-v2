<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgFin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#041b1d"/>
      <stop offset="100%" stop-color="#02090e"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgFin)"/>

  <!-- Analytics Card Frame -->
  <rect x="200" y="90" width="400" height="250" rx="20" fill="#061f22" stroke="#10b981" stroke-width="2"/>
  <rect x="225" y="115" width="350" height="35" rx="8" fill="#0a2e33"/>
  <text x="245" y="137" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">FINTRACK // CASH_FLOW_TELEMETRY</text>

  <!-- Metric Numbers -->
  <text x="245" y="180" fill="#94a3b8" font-family="sans-serif" font-size="11">TOTAL BALANCE</text>
  <text x="245" y="210" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="bold">Rp 48.750.000</text>
  <text x="410" y="210" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">+24.8% ↑</text>

  <!-- Mini Chart -->
  <path d="M245 300 Q 290 270, 335 285 T 425 240 T 515 250 T 555 220" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  <path d="M245 300 Q 290 270, 335 285 T 425 240 T 515 250 T 555 220 L 555 315 L 245 315 Z" fill="url(#chartGrad)"/>

  <!-- Dots on chart -->
  <circle cx="335" cy="285" r="4" fill="#34d399"/>
  <circle cx="425" cy="240" r="4" fill="#34d399"/>
  <circle cx="555" cy="220" r="5" fill="#ffffff" stroke="#10b981" stroke-width="2"/>

  <!-- Floating Badges -->
  <g transform="translate(150, 230)">
    <rect width="115" height="32" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="57" y="20" text-anchor="middle" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">50/30/20 RULE</text>
  </g>
  <g transform="translate(535, 230)">
    <rect width="125" height="32" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="62" y="20" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">OFFLINE-FIRST</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="405" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">Gengs Fintrack: Financial Analytics</text>
  <text x="400" y="438" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">Solo Web App · Interactive Telemetry &amp; Budgeting</text>
</svg>
