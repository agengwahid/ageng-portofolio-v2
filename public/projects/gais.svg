<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgGais" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#050b14"/>
    </linearGradient>
    <linearGradient id="primaryGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgGais)"/>
  
  <!-- Subtle Grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="100" y1="0" x2="100" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="700" y1="0" x2="700" y2="500"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
  </g>

  <!-- Central Asset Box & QR motif -->
  <rect x="250" y="100" width="300" height="230" rx="20" fill="#0f172a" stroke="#2563eb" stroke-width="3"/>
  <rect x="275" y="125" width="250" height="40" rx="8" fill="#1e293b"/>
  <circle cx="300" cy="145" r="6" fill="#38bdf8"/>
  <circle cx="320" cy="145" r="6" fill="#38bdf8" opacity="0.6"/>
  <circle cx="340" cy="145" r="6" fill="#38bdf8" opacity="0.3"/>
  <text x="505" y="150" text-anchor="end" fill="#94a3b8" font-family="monospace" font-size="12">GAIS_ASSET_SYS</text>

  <!-- QR / Barcode Pattern -->
  <g transform="translate(320, 190)">
    <rect x="0" y="0" width="40" height="40" rx="4" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <rect x="10" y="10" width="20" height="20" fill="#38bdf8"/>
    <rect x="120" y="0" width="40" height="40" rx="4" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <rect x="130" y="10" width="20" height="20" fill="#38bdf8"/>
    <rect x="0" y="65" width="40" height="40" rx="4" fill="none" stroke="#38bdf8" stroke-width="4"/>
    <rect x="10" y="75" width="20" height="20" fill="#38bdf8"/>
    <!-- Center data lines -->
    <line x1="60" y1="10" x2="100" y2="10" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="25" x2="90" y2="25" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="40" x2="100" y2="40" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="75" x2="150" y2="75" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="90" x2="140" y2="90" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <line x1="60" y1="105" x2="120" y2="105" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Floating Pills -->
  <g transform="translate(180, 260)">
    <rect width="130" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="65" y="22" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold">QR AUDIT</text>
  </g>
  <g transform="translate(490, 260)">
    <rect width="140" height="34" rx="17" fill="#1e293b" stroke="#2563eb" stroke-width="1.5"/>
    <text x="70" y="22" text-anchor="middle" fill="#e2e8f0" font-family="monospace" font-size="12" font-weight="bold">MAINTENANCE</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="400" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" letter-spacing="1">GAIS · Asset Management Suite</text>
  <text x="400" y="435" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">Enterprise Team Project · SJP Mining Operations</text>
</svg>
