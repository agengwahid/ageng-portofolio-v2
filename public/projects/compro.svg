<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bgCompro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071526"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgCompro)"/>

  <!-- Browser Frame Motif -->
  <rect x="180" y="90" width="440" height="260" rx="16" fill="#0b1329" stroke="#1d4ed8" stroke-width="2.5"/>
  <rect x="180" y="90" width="440" height="38" rx="16" fill="#1e293b"/>
  <!-- Browser Dots -->
  <circle cx="205" cy="109" r="5" fill="#ef4444"/>
  <circle cx="220" cy="109" r="5" fill="#eab308"/>
  <circle cx="235" cy="109" r="5" fill="#22c55e"/>
  <!-- URL Bar -->
  <rect x="260" y="99" width="280" height="20" rx="6" fill="#0f172a"/>
  <text x="270" y="113" fill="#64748b" font-family="monospace" font-size="10">https://sjp-mining.co.id</text>

  <!-- Content Wireframe inside Browser -->
  <rect x="205" y="145" width="220" height="20" rx="4" fill="#3b82f6"/>
  <rect x="205" y="175" width="160" height="10" rx="3" fill="#475569"/>
  <rect x="205" y="192" width="140" height="10" rx="3" fill="#475569"/>

  <!-- Button in wireframe -->
  <rect x="205" y="220" width="90" height="24" rx="6" fill="#2563eb"/>
  <text x="250" y="236" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Lihat Profil</text>

  <!-- Right Visual inside Browser (Corporate Building/Shield) -->
  <rect x="445" y="145" width="150" height="175" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <polygon points="520,165 470,210 470,290 570,290 570,210" fill="#1e3a8a" opacity="0.6"/>
  <rect x="505" y="250" width="30" height="40" fill="#60a5fa"/>

  <!-- Badges -->
  <g transform="translate(140, 240)">
    <rect width="110" height="32" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="55" y="20" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">DYNAMIC CMS</text>
  </g>
  <g transform="translate(560, 240)">
    <rect width="105" height="32" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="52" y="20" text-anchor="middle" fill="#6ee7b7" font-family="monospace" font-size="11" font-weight="bold">SEO 99/100</text>
  </g>

  <!-- Title Bottom -->
  <text x="400" y="405" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold">Corporate Company Profile &amp; Portal</text>
  <text x="400" y="438" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">Enterprise Team Web Project · Modern Architecture &amp; CMS</text>
</svg>
